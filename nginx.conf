server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Additional MIME types
    types {
        application/octet-stream pmtiles;
    }

    # Gzip compression
    gzip on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/css application/octet-stream text/javascript;

    # Static assets - long cache, immutable
    location ~* \.(js|css|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Data files - daily cache
    location ~* \.(json|geojson|pmtiles)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
