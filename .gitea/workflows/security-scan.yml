name: Security Scan
on: [push]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz | tar -xz
          chmod +x gitleaks
      - name: Scan for secrets
        run: ./gitleaks git --log-opts="--all" --no-banner --exit-code 1

